<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <link rel="canonical" href="https://kreadesigns.es/portfolio-3dworks.html" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Works | Krea Designs</title>
    <link rel="icon" type="image/png" href="https://kreadesigns.es/favicon.png" sizes="512x512">
    <link rel="apple-touch-icon" href="https://kreadesigns.es/favicon.png">
    <link rel="icon" type="image/png" href="https://kreadesigns.es/favicon.png" sizes="192x192">
    <link rel="icon" type="image/png" href="https://kreadesigns.es/favicon.png" sizes="32x32">
    <meta name="theme-color" content="#0A0A0A">
    <meta name="description" content="Proyectos de 3D Works con altísimo nivel de detalle. Estética premium y visuales de alto impacto.">
    <meta name="keywords" content="3D Works, Renders 3D, Diseño 3D, Krea Designs, Portafolio">
    <meta name="author" content="Krea Designs">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { primary: "#D4AF37", "background-light": "#FAFAFA", "background-dark": "#0A0A0A" },
                    fontFamily: { display: ["Space Grotesk", "sans-serif"], serif: ["Cinzel", "serif"], sans: ["Inter", "sans-serif"] },
                },
            },
        };
    </script>
    <style>
        .glass-nav {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .logo-invert-logic {
            filter: grayscale(100%) invert(1) !important;
            transition: filter 0.3s ease;
        }
        .dark .logo-invert-logic {
            filter: grayscale(100%) invert(0) !important;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <link rel="stylesheet" href="assets/css/circular-gallery.css">
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-sans transition-colors duration-300">

    <!-- Navigation -->
    <nav
        class="fixed top-0 w-full z-50 glass-nav border-b border-slate-200/50 dark:border-white/10 bg-white dark:bg-background-dark/90">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="assets/logo-agency-dark.png" alt="Logotipo de Krea Designs, Estudio de Diseño y Branding"
                        class="h-10 w-auto dark:invert transition-all duration-300 group-hover:scale-105" fetchpriority="high">

                    <span
                        class="font-display font-bold text-xl tracking-tight hidden sm:block text-slate-900 dark:text-white">KREA<span
                            class="text-primary">DESIGNS</span></span>
                </a>
            </div>
            <div class="hidden md:flex items-center gap-10">
                <a href="index.html"
                    class="text-xs uppercase tracking-[0.2em] font-medium hover:text-primary transition-colors">Inicio</a>
                <a href="projects.html"
                    class="text-xs uppercase tracking-[0.2em] font-medium text-primary">Portafolio</a>
            </div>
            <div class="flex items-center gap-4">
                <button id="themeToggle"
                    class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-white/10 transition-colors">
                    <span class="material-icons-outlined block dark:hidden">dark_mode</span>
                    <span class="material-icons-outlined hidden dark:block">light_mode</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-32 pb-24 px-6 min-h-screen">
        <div class="max-w-7xl mx-auto">
            <div class="flex items-center justify-between mb-12 fade-in">
                <h1 class="font-display font-semibold text-3xl md:text-5xl uppercase tracking-wide">3D WORKS
                </h1>
                <a href="projects.html"
                    class="text-xs uppercase tracking-widest text-slate-500 hover:text-primary transition-colors flex items-center gap-2">
                    <span class="material-icons-outlined text-sm">arrow_back</span> Volver
                </a>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 3D Works Gallery -->
                <div class="group relative overflow-hidden fade-in aspect-square bg-transparent cursor-pointer"
                    onclick="open3DGallery()">
                    <div
                        class="w-full h-full flex items-center justify-center transition-transform duration-700 group-hover:scale-110 bg-slate-100 dark:bg-zinc-900">
                        <img src="assets/3dworks/Render_Final_Diorama_Cycles.png" alt="Proyecto 3D Works"
                            class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity" loading="lazy">
                    </div>
                    <div
                        class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col items-center justify-center p-6 text-center">
                        <h3 class="font-display font-bold text-2xl text-white mb-2">Proyectos 3D</h3>
                        <p class="text-xs text-primary uppercase tracking-widest mb-4">3D Works</p>
                        <p class="text-sm text-slate-200 font-light mb-6 uppercase tracking-tight">Explorar Galería</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-background-light dark:bg-background-dark py-12 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-3 opacity-50">
                <img src="assets/logo-agency-dark.png" alt="Krea Designs" class="h-6 dark:invert" loading="lazy">

            </div>
            <p class="text-xs text-slate-500 uppercase tracking-widest">© 2024 KreaDesigns. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module">
        // Dark Mode Logic
        const themeToggleBtn = document.getElementById('themeToggle');
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        });

        // Global Observers
        const scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    scrollObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in').forEach(el => {
            scrollObserver.observe(el);
            if (el.getBoundingClientRect().top < window.innerHeight) {
                el.classList.add('visible');
            }
        });

        // circular-gallery integration
        import { CircularGalleryApp } from './assets/js/circular-gallery.js';

        // 3D Works images
        const works3DImages = [
            'assets/3dworks/Cartel_Mercadito.png',
            'assets/3dworks/Papas_Fritas_Composicion.png',
            'assets/3dworks/Papas_Fritas_Encuadre_Abajo.png',
            'assets/3dworks/Papas_Fritas_Encuadre_Centrado.png',
            'assets/3dworks/Papas_Fritas_Encuadre_De_Lado.png',
            'assets/3dworks/Render_Final_Diorama_Cycles.png',
            'assets/3dworks/Render_Final_Diorama_Street.Eevee.png',
            'assets/3dworks/Render_Final_Diorama_Street.Eevee_CARRO.png',
            'assets/3dworks/Render_Mathias.png',
            'assets/3dworks/Stand 3.png',
            'assets/3dworks/Stand.png',
            'assets/3dworks/Stand2.png',
            'assets/3dworks/composicion_blender_final.png'
        ];

        function openCircularGallery(title, subtitle, items, aspectRatio = 1.0) {
            const modal = document.createElement('div');
            modal.id = 'galleryModal';
            modal.className = 'fixed inset-0 z-[100] bg-white dark:bg-black overflow-hidden h-screen w-screen';
            modal.innerHTML = `
                <div class="fixed top-0 left-0 w-full flex justify-between items-center p-8 z-[110] bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-black/5 dark:border-white/5">
                    <button id="closeGallery" class="flex items-center gap-2 text-slate-500 hover:text-primary transition-colors uppercase tracking-widest text-[10px] font-bold">
                        <span class="material-icons-outlined text-lg">arrow_back</span> Cerrar
                    </button>
                    <div class="flex flex-col items-center flex-1">
                        <h2 class="font-display font-bold text-2xl text-black dark:text-white leading-tight">${title}</h2>
                        <p class="text-primary text-[10px] uppercase tracking-[0.2em]">${subtitle}</p>
                    </div>
                    <button class="text-black dark:text-white hover:text-primary transition-colors bg-black/5 dark:bg-white/10 p-3 rounded-full flex items-center justify-center shadow-lg" id="closeButtonTop">
                        <span class="material-icons-outlined text-3xl">close</span>
                    </button>
                </div>
                <div id="circularGalleryContainer" class="w-full h-full"></div>
            `;
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';

            const container = document.getElementById('circularGalleryContainer');
            const galleryItems = items.map((img, i) => ({ 
                image: img, 
                text: `${title} ${i + 1}` 
            }));

            const app = new CircularGalleryApp(container, {
                items: galleryItems,
                bend: 3,
                textColor: '#D4AF37',
                borderRadius: 0.05,
                font: 'bold 24px Inter',
                aspectRatio: aspectRatio
            });

            const closeAction = () => {
                app.destroy();
                modal.remove();
                document.body.style.overflow = 'auto';
            };

            document.getElementById('closeGallery').onclick = closeAction;
            document.getElementById('closeButtonTop').onclick = closeAction;
        }

        window.open3DGallery = () => openCircularGallery('Proyectos 3D', '3D Works', works3DImages, 1.0);
    </script>
</body>

</html>
